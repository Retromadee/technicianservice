# ============================================
# HomeFix Pro - Application Configuration
# Uses environment variables for Docker/Production deployment
# Falls back to local dev defaults
# ============================================

spring.application.name=HomeFix Pro

# Server
server.port=${SERVER_PORT:8081}

# ---- PostgreSQL ----
# spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/homefixdb}
# spring.datasource.username=${SPRING_DATASOURCE_USERNAME:retro}
# spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# ---- H2 (secondary/test) ----
spring.datasource.url=jdbc:h2:mem:homefixdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:SG9tZUZpeF9Qcm9fU3VwZXJfU2VjcmV0X0tleV8yNTZiaXRfQ2hhbmdlX1RoaXNfSW5fUHJvZHVjdGlvbl8yMDI2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- AI API Keys ----
app.ai.openai-api-key=${OPENAI_API_KEY:YOUR_OPENAI_API_KEY}
app.ai.google-vision-api-key=${GOOGLE_VISION_API_KEY:YOUR_GOOGLE_VISION_API_KEY}

# ---- File Upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:./uploads}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:3000}
