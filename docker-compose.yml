# ============================================================
# HomeFix Pro — Docker Compose
# Orchestrates: PostgreSQL DB + Spring Boot API
# ============================================================

services:

  # ---- PostgreSQL Database ----
  db:
    image: postgres:16-alpine
    container_name: homefix_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: homefixdb
      POSTGRES_USER: homefix_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-homefix_secure_pass}
    volumes:
      - homefix_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homefix_user -d homefixdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Spring Boot API ----
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homefix_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database — points to the 'db' service (Docker internal DNS)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/homefixdb
      SPRING_DATASOURCE_USERNAME: homefix_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-homefix_secure_pass}
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"

      # JWT
      JWT_SECRET: ${JWT_SECRET:-SG9tZUZpeF9Qcm9fU3VwZXJfU2VjcmV0X0tleV8yNTZiaXRfQ2hhbmdlX1RoaXNfSW5fUHJvZHVjdGlvbl8yMDI2}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}

      # AI Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-YOUR_OPENAI_API_KEY}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-YOUR_GOOGLE_VISION_API_KEY}

      # CORS — add your production frontend URL here
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}

      # Server
      SERVER_PORT: 8081

    ports:
      - "8081:8081"
    volumes:
      - homefix_uploads:/app/uploads

volumes:
  homefix_pgdata:
  homefix_uploads:
